[project]
name = "projectflow-backend"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.115",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.4",
    "pyjwt>=2.9",
    "pwdlib[argon2]>=0.2",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27", "hypothesis>=6.100", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py313"
# Applied migrations are history: never reformat them.
extend-exclude = ["migrations/versions"]

[tool.ruff.lint.per-file-ignores]
# SQLAlchemy reads `type_annotation_map` and `__mapper_args__` as plain class dicts.
"app/db/models.py" = ["RUF012"]
